# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi yêu cầu thiếu thông tin bắt buộc (như thiếu tên tài khoản/handle khi lấy tweet cá nhân, hoặc thiếu đường dẫn URL khi yêu cầu đọc/tóm tắt bài viết). Trước hành động có tác dụng bên ngoài như gửi/đăng lên Telegram, dùng clarify với response_type='yes_no' để xin xác nhận rõ ràng; yêu cầu gửi ban đầu không được xem là xác nhận. Không dùng khi đã đủ thông tin hoặc khi câu hỏi nằm ngoài phạm vi research."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn gọn, rõ ràng gửi cho người dùng để xin thông tin còn thiếu."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu câu trả lời mong đợi: 'text' khi hỏi thông tin mở còn thiếu (như tài khoản hoặc URL), 'yes_no' để xin xác nhận trước hành động gửi/đăng hoặc hỏi có/không, 'choice' khi đưa danh sách lựa chọn."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type='choice'."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng (tweet) gần đây CỦA một tài khoản X/Twitter cụ thể. Dùng khi người dùng nêu rõ tên người hoặc tài khoản cần xem. Không dùng để tìm kiếm tweet theo chủ đề chung (hãy dùng social_search) và không tự đoán tài khoản nếu người dùng chưa nêu (hãy dùng clarify)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X/Twitter của tài khoản, viết chữ thường, KHÔNG có ký tự '@' (ví dụ: Sam Altman -> 'sama', Elon Musk -> 'elonmusk', Andrej Karpathy -> 'karpathy')."}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy (mặc định 5, hoặc theo số lượng người dùng yêu cầu)."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng (tweet) trên mạng xã hội X/Twitter theo từ khóa hoặc chủ đề. Dùng khi muốn biết cộng đồng đang bàn luận gì về một chủ đề. Không dùng để lấy timeline của một cá nhân cụ thể (hãy dùng timeline) và không dùng để tìm tin tức báo chí trên web (hãy dùng lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề cần tìm trên mạng xã hội."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: dùng 'Top' khi người dùng yêu cầu tweet phổ biến/nổi bật/top nhất; dùng 'Latest' cho tweet mới nhất hoặc mặc định."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng trả về."}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin hoặc tin tức trên web. Dùng khi cần tra cứu tin tức thời sự hoặc thông tin tổng hợp trên internet. Không dùng khi người dùng đã đưa sẵn một URL cụ thể cần đọc (hãy dùng fetch) hoặc khi tìm bài đăng mạng xã hội (hãy dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa truy vấn tìm kiếm."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' cho tin tức thời sự, 'general' cho tra cứu chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' (hôm nay), 'week' (tuần này), 'month' (tháng này), 'year' (năm nay)."}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa."}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất toàn bộ nội dung văn bản từ một địa chỉ URL cụ thể. Chỉ dùng khi người dùng đã cung cấp URL hợp lệ (http/https). Không dùng để tìm kiếm theo từ khóa (hãy dùng lookup) và không tự bịa URL nếu người dùng chưa cung cấp (hãy dùng clarify)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ (bắt đầu bằng http:// hoặc https://) do người dùng cung cấp."}
      required: [url]

  - name: format
    description: "Định dạng danh sách các mục thông tin (items) đã thu thập được thành bản tin markdown theo mẫu. Chỉ dùng khi đã có sẵn dữ liệu items cần trình bày."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục thông tin cần định dạng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu trình bày bản tin."}
        headline: {type: string, default: "", description: "Tiêu đề bản tin."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi bản tin văn bản lên kênh Telegram. Không gọi tool này chỉ dựa trên yêu cầu gửi/đăng ban đầu. Trước tiên phải xin xác nhận rõ ràng bằng clarify(response_type='yes_no'); chỉ gọi send sau khi người dùng xác nhận ở lượt sau, với confirmed=true. Không bao giờ dùng tool này để trả lời câu hỏi thông thường, giải toán hay viết code của người dùng."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi lên Telegram."}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true sau khi người dùng xác nhận rõ ràng nội dung cần gửi ở lượt sau. Yêu cầu gửi ban đầu không phải là xác nhận."}
      required: [text]

  - name: policy
    description: "Tra cứu quy định, chính sách nội bộ của công ty (company policy) về nghiên cứu AI, trích dẫn nguồn, bảo mật dữ liệu, đăng tải ra ngoài hoặc sử dụng công cụ. Không dùng để tìm tin tức công khai trên web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa chính sách cần tra cứu."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách nội bộ tương ứng."}
        top_k: {type: integer, default: 3, description: "Số mục kết quả trả về."}
      required: [query]

  - name: papers
    description: "Tìm kiếm bài báo khoa học (preprint/paper) trên arXiv theo từ khóa hoặc chủ đề nghiên cứu. Không dùng khi đã có mã arXiv ID cụ thể và chỉ muốn đọc nội dung PDF (hãy dùng paper_text)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề bài báo khoa học trên arXiv."}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp kết quả."}
      required: [query]

  - name: paper_text
    description: "Tải PDF và trích xuất nội dung văn bản của một bài báo arXiv khi đã biết arXiv ID hoặc URL cụ thể của bài báo đó."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Mã arXiv ID (ví dụ '1706.03762') hoặc URL bài báo arXiv."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa cần lấy."}
      required: [arxiv_url]
